[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-engine"
version = "1.0.0"
description = "NIFTY options decision engine: market data, regime, direction probability, strike selection, risk, paper/live execution via Kite Connect"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "websockets>=12",
    "pydantic>=2.6",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["nifty_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
